plugins {
	// 1.21.x 는 난독화 버전이라 -remap 변형 Loom 을 쓴다
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = 'block_custom_rules'
}

repositories {
	// 옵션 화면을 Mod Menu 에 거는 데만 쓴다(없어도 돈다)
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Fabric API 는 클라 명령(/bcr) · 생명 주기 이벤트 · 리소스 로더만 쓴다 — 프로필에 이미 깔린 것을 쓰고 jar 에 넣지 않는다
	modImplementation fabricApi.module("fabric-command-api-v2", project.fabric_api_version)
	// 태그 도착 · 클라 월드 바뀜 · 엔티티 · 청크 내려감(D11 · D40)
	modImplementation fabricApi.module("fabric-lifecycle-events-v1", project.fabric_api_version)
	// 리팩 규칙 파일 다시 읽기(D11)
	modImplementation fabricApi.module("fabric-resource-loader-v0", project.fabric_api_version)
	// Sodium 사각면(QuadEmitter)을 받는 데만 — Sodium 이 쓰는 렌더러 API 라 Sodium 이 있을 때만 읽힌다
	modCompileOnly fabricApi.module("fabric-renderer-api-v1", project.fabric_api_version)
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
